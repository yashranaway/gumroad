name: Marketing readiness

# A feature merges WITH its marketing artifacts (Sahil, 2026-10-23): the announcement mail and the
# social posts are part of shipping it, not a follow-up. This job is the check named
# `marketing/ready` in the `main` ruleset, so it is the one gate a human merge from the UI also
# passes through. The rule, the marker grammar and the exempt classes: bin/marketing-marker-check.
#
# The PR is read through the API rather than the event payload, so the check reflects the body as it
# is NOW — that is also why editing the description re-runs it (no push needed).
#
# A draft is skipped (it cannot merge anyway); the check re-runs on ready_for_review.
# `workflow_dispatch` takes a PR number so a human or an agent can re-run it by hand.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  marketing:
    name: marketing/ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the marketing marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body,headRefOid,isDraft > pr.json
          python3 bin/marketing-marker-check pr.json
